# Cấu hình Nginx khi triển khai trên máy chủ / VPS với tên miền riêng
# Ví dụ: http://lms.bachanhtu/sinhhoc12 hoặc https://lms.bachanhtu.edu.vn/sinhhoc12

server {
    listen 80;
    server_name lms.bachanhtu;

    client_max_body_size 50M;

    location = /sinhhoc12 {
        return 301 /sinhhoc12/;
    }

    location /sinhhoc12/ {
        proxy_pass http://127.0.0.1:8080/sinhhoc12/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
