<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="strandOld" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="strandNew" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" rx="16" fill="url(#bg)"/>
  <text x="34" y="42" font-family="sans-serif" font-size="20" font-weight="800" fill="#0f172a">SƠ ĐỒ CẤU TRÚC XOẮN KÉP DNA &amp; CƠ CHẾ TÁI BẢN BÁN BẢO TOÀN</text>
  <text x="34" y="66" font-family="sans-serif" font-size="13" fill="#475569">Nguyên tắc bổ sung (A = T, G ≡ C) • Enzyme DNA polymerase chỉ tổng hợp mạch mới theo chiều 5' → 3'</text>

  <!-- Double helix left section -->
  <g stroke-linecap="round">
    <path d="M 48 185 C 100 185, 110 295, 165 295 C 220 295, 230 185, 285 185 C 330 185, 348 215, 390 215" fill="none" stroke="url(#strandOld)" stroke-width="10"/>
    <path d="M 48 295 C 100 295, 110 185, 165 185 C 220 185, 230 295, 285 295 C 330 295, 348 265, 390 265" fill="none" stroke="url(#strandOld)" stroke-width="10"/>

    <!-- Base pair rungs in helix -->
    <line x1="76" y1="205" x2="76" y2="275" stroke="#0f766e" stroke-width="6"/>
    <line x1="165" y1="194" x2="165" y2="286" stroke="#e11d48" stroke-width="6"/>
    <line x1="202" y1="208" x2="202" y2="272" stroke="#0284c7" stroke-width="6"/>
    <line x1="285" y1="194" x2="285" y2="286" stroke="#7c3aed" stroke-width="6"/>
    <line x1="322" y1="204" x2="322" y2="276" stroke="#d97706" stroke-width="6"/>
  </g>

  <!-- Labels for parent DNA -->
  <text x="44" y="168" font-family="monospace" font-size="14" font-weight="800" fill="#0f766e">3'</text>
  <text x="44" y="324" font-family="monospace" font-size="14" font-weight="800" fill="#0f766e">5'</text>
  <rect x="65" y="346" width="225" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="177" y="366" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">DNA mẹ (mạch kép xoắn đều)</text>
  <text x="177" y="382" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Liên kết Hydrogen: A=T (2) • G≡C (3)</text>

  <!-- Helicase enzyme at replication fork -->
  <polygon points="376,240 442,198 442,282" fill="#f59e0b" stroke="#b45309" stroke-width="2.5"/>
  <text x="418" y="244" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">Helicase</text>
  <text x="410" y="306" font-family="sans-serif" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">Chạc chữ Y</text>
  <text x="410" y="322" font-family="sans-serif" font-size="11" fill="#78350f" text-anchor="middle">(Tháo xoắn &amp; cắt H)</text>

  <!-- Upper fork (Leading strand: Template 3'->5', New strand 5'->3' continuous) -->
  <path d="M 390 215 Q 455 135 535 135 L 895 135" fill="none" stroke="url(#strandOld)" stroke-width="10" stroke-linecap="round"/>
  <text x="905" y="140" font-family="monospace" font-size="14" font-weight="800" fill="#0f766e">5'</text>
  <text x="530" y="118" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f766e">Mạch khuôn gốc (3' → 5')</text>

  <!-- Leading new strand -->
  <path d="M 888 175 L 495 175" fill="none" stroke="url(#strandNew)" stroke-width="9" stroke-linecap="round"/>
  <polygon points="482,175 498,167 498,183" fill="#0284c7"/>
  <text x="896" y="180" font-family="monospace" font-size="14" font-weight="800" fill="#0284c7">5'</text>
  <text x="466" y="179" font-family="monospace" font-size="14" font-weight="800" fill="#0284c7">3'</text>

  <!-- Base pair ticks upper -->
  <g stroke="#94a3b8" stroke-width="3">
    <line x1="540" y1="140" x2="540" y2="170"/><line x1="585" y1="140" x2="585" y2="170"/>
    <line x1="630" y1="140" x2="630" y2="170"/><line x1="675" y1="140" x2="675" y2="170"/>
    <line x1="720" y1="140" x2="720" y2="170"/><line x1="765" y1="140" x2="765" y2="170"/>
    <line x1="810" y1="140" x2="810" y2="170"/><line x1="855" y1="140" x2="855" y2="170"/>
  </g>

  <!-- DNA Polymerase upper -->
  <ellipse cx="520" cy="175" rx="44" ry="20" fill="#0ea5e9" stroke="#0369a1" stroke-width="2"/>
  <text x="520" y="179" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">DNA Pol</text>
  <rect x="600" y="192" width="286" height="32" rx="8" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="743" y="212" font-family="sans-serif" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">Mạch dẫn đầu: Tổng hợp LIÊN TỤC (5' → 3')</text>

  <!-- Lower fork (Lagging strand: Template 5'->3', Okazaki fragments) -->
  <path d="M 390 265 Q 455 365 535 365 L 895 365" fill="none" stroke="url(#strandOld)" stroke-width="10" stroke-linecap="round"/>
  <text x="905" y="370" font-family="monospace" font-size="14" font-weight="800" fill="#0f766e">3'</text>
  <text x="530" y="392" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f766e">Mạch khuôn gốc (5' → 3')</text>

  <!-- Okazaki fragments -->
  <g stroke="url(#strandNew)" stroke-width="9" stroke-linecap="round">
    <line x1="495" y1="325" x2="600" y2="325"/>
    <line x1="635" y1="325" x2="745" y2="325"/>
    <line x1="780" y1="325" x2="885" y2="325"/>
  </g>
  <!-- RNA primers (amber tips) -->
  <g stroke="#f59e0b" stroke-width="9" stroke-linecap="round">
    <line x1="495" y1="325" x2="512" y2="325"/>
    <line x1="635" y1="325" x2="652" y2="325"/>
    <line x1="780" y1="325" x2="797" y2="325"/>
  </g>
  <!-- Arrows pointing right (5' -> 3') -->
  <polygon points="614,325 598,317 598,333" fill="#0284c7"/>
  <polygon points="759,325 743,317 743,333" fill="#0284c7"/>
  <polygon points="898,325 882,317 882,333" fill="#0284c7"/>

  <!-- Ligase badge -->
  <circle cx="765" cy="306" r="16" fill="#be123c"/>
  <text x="765" y="310" font-family="sans-serif" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">Ligase</text>

  <rect x="520" y="255" width="366" height="34" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="703" y="276" font-family="sans-serif" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Mạch theo sau: Tổng hợp GIÁN ĐOẠN (Đoạn Okazaki) → Ligase nối</text>

  <!-- Legend footer -->
  <g transform="translate(34, 424)">
    <rect x="0" y="0" width="892" height="38" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="24" cy="19" r="6" fill="#0f766e"/>
    <text x="38" y="23" font-family="sans-serif" font-size="12" font-weight="600" fill="#334155">Mạch gốc DNA mẹ</text>
    <circle cx="190" cy="19" r="6" fill="#0284c7"/>
    <text x="204" y="23" font-family="sans-serif" font-size="12" font-weight="600" fill="#334155">Mạch mới tổng hợp (5'→3')</text>
    <circle cx="400" cy="19" r="6" fill="#f59e0b"/>
    <text x="414" y="23" font-family="sans-serif" font-size="12" font-weight="600" fill="#334155">Đoạn mồi RNA / Helicase</text>
    <circle cx="600" cy="19" r="6" fill="#be123c"/>
    <text x="614" y="23" font-family="sans-serif" font-size="12" font-weight="600" fill="#334155">Enzyme DNA Ligase nối đoạn Okazaki</text>
  </g>
</svg>
