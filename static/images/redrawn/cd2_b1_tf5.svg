<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300">
  <rect width="680" height="300" fill="#ffffff"/>
  <!-- Tế bào 1: Kì sau Giảm phân II (mỗi cực 4 NST đơn không tương đồng: A, b, c, D -> 2n = 8) -->
  <g transform="translate(20,16)">
    <ellipse cx="150" cy="126" rx="132" ry="112" fill="#f8fafc" stroke="#0f172a" stroke-width="2.2"/>
    <!-- Hai cực -->
    <circle cx="42" cy="126" r="4" fill="#0f172a"/>
    <circle cx="258" cy="126" r="4" fill="#0f172a"/>
    <!-- Thoi vô sắc -->
    <g stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3">
      <line x1="42" y1="126" x2="112" y2="56"/><line x1="42" y1="126" x2="112" y2="102"/>
      <line x1="42" y1="126" x2="112" y2="150"/><line x1="42" y1="126" x2="112" y2="196"/>
      <line x1="258" y1="126" x2="188" y2="56"/><line x1="258" y1="126" x2="188" y2="102"/>
      <line x1="258" y1="126" x2="188" y2="150"/><line x1="258" y1="126" x2="188" y2="196"/>
    </g>
    <!-- Cực trái: 4 NST đơn A, b, c, D (khác kích thước) -->
    <path d="M 124 44 L 106 56 L 124 68" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 122 93 L 108 102 L 122 111" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 120 143 L 109 150 L 120 157" fill="none" stroke="#0369a1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 118 190 L 110 196 L 118 202" fill="none" stroke="#be123c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cực phải: 4 NST đơn A, b, c, D -->
    <path d="M 176 44 L 194 56 L 176 68" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 178 93 L 192 102 L 178 111" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 180 143 L 191 150 L 180 157" fill="none" stroke="#0369a1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 182 190 L 190 196 L 182 202" fill="none" stroke="#be123c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Nhãn NST -->
    <g font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">
      <text x="130" y="61">A</text><text x="160" y="61">A</text>
      <text x="130" y="107">b</text><text x="161" y="107">b</text>
      <text x="130" y="155">c</text><text x="161" y="155">c</text>
      <text x="130" y="201">D</text><text x="160" y="201">D</text>
    </g>
    <text x="150" y="264" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Tế bào 1</text>
  </g>

  <!-- Tế bào 2: Kì sau Nguyên phân (mỗi cực 4 NST đơn gồm 2 cặp tương đồng: A, a, M, n -> 2n = 4) -->
  <g transform="translate(360,16)">
    <ellipse cx="150" cy="126" rx="132" ry="112" fill="#f8fafc" stroke="#0f172a" stroke-width="2.2"/>
    <circle cx="42" cy="126" r="4" fill="#0f172a"/>
    <circle cx="258" cy="126" r="4" fill="#0f172a"/>
    <g stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3">
      <line x1="42" y1="126" x2="112" y2="56"/><line x1="42" y1="126" x2="112" y2="102"/>
      <line x1="42" y1="126" x2="112" y2="150"/><line x1="42" y1="126" x2="112" y2="196"/>
      <line x1="258" y1="126" x2="188" y2="56"/><line x1="258" y1="126" x2="188" y2="102"/>
      <line x1="258" y1="126" x2="188" y2="150"/><line x1="258" y1="126" x2="188" y2="196"/>
    </g>
    <!-- Cực trái: cặp dài A, a + cặp ngắn M, n -->
    <path d="M 124 44 L 106 56 L 124 68" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 124 90 L 106 102 L 124 114" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 119 143 L 109 150 L 119 157" fill="none" stroke="#0369a1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 119 189 L 109 196 L 119 203" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cực phải: cặp dài A, a + cặp ngắn M, n -->
    <path d="M 176 44 L 194 56 L 176 68" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 176 90 L 194 102 L 176 114" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 181 143 L 191 150 L 181 157" fill="none" stroke="#0369a1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 181 189 L 191 196 L 181 203" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">
      <text x="130" y="61">A</text><text x="160" y="61">A</text>
      <text x="130" y="107">a</text><text x="161" y="107">a</text>
      <text x="129" y="155">M</text><text x="158" y="155">M</text>
      <text x="130" y="201">n</text><text x="161" y="201">n</text>
    </g>
    <text x="150" y="264" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Tế bào 2</text>
  </g>
</svg>
