<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260">
  <rect width="720" height="260" fill="#ffffff"/>
  <!-- 4 cặp NST tương đồng minh họa trình tự các gene X, Y, Z (Hình 4 là đáp án đúng) -->

  <!-- Hình 1: Đảo ngược thứ tự trên chiếc thứ 2 (X,Y,Z và z,y,x) -->
  <g transform="translate(36, 20)">
    <rect x="24" y="10" width="22" height="170" rx="11" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
    <circle cx="35" cy="70" r="7" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <rect x="24" y="34" width="22" height="10" fill="#0f766e"/>
    <rect x="24" y="102" width="22" height="10" fill="#0369a1"/>
    <rect x="24" y="144" width="22" height="10" fill="#be123c"/>
    <text x="10" y="44" font-family="sans-serif" font-size="13" font-weight="700">X</text>
    <text x="10" y="112" font-family="sans-serif" font-size="13" font-weight="700">Y</text>
    <text x="10" y="154" font-family="sans-serif" font-size="13" font-weight="700">Z</text>

    <rect x="64" y="10" width="22" height="170" rx="11" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
    <circle cx="75" cy="70" r="7" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <rect x="64" y="34" width="22" height="10" fill="#be123c"/>
    <rect x="64" y="102" width="22" height="10" fill="#0369a1"/>
    <rect x="64" y="144" width="22" height="10" fill="#0f766e"/>
    <text x="92" y="44" font-family="sans-serif" font-size="13" font-weight="700">z</text>
    <text x="92" y="112" font-family="sans-serif" font-size="13" font-weight="700">y</text>
    <text x="92" y="154" font-family="sans-serif" font-size="13" font-weight="700">x</text>
    <text x="55" y="212" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Hình 1</text>
  </g>

  <!-- Hình 2: Hoán đổi locus Y và Z trên chiếc thứ 2 -->
  <g transform="translate(210, 20)">
    <rect x="24" y="10" width="22" height="170" rx="11" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
    <circle cx="35" cy="70" r="7" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <rect x="24" y="34" width="22" height="10" fill="#0f766e"/>
    <rect x="24" y="102" width="22" height="10" fill="#0369a1"/>
    <rect x="24" y="144" width="22" height="10" fill="#be123c"/>
    <text x="10" y="44" font-family="sans-serif" font-size="13" font-weight="700">X</text>
    <text x="10" y="112" font-family="sans-serif" font-size="13" font-weight="700">Y</text>
    <text x="10" y="154" font-family="sans-serif" font-size="13" font-weight="700">Z</text>

    <rect x="64" y="10" width="22" height="170" rx="11" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
    <circle cx="75" cy="70" r="7" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <rect x="64" y="34" width="22" height="10" fill="#0f766e"/>
    <rect x="64" y="102" width="22" height="10" fill="#be123c"/>
    <rect x="64" y="144" width="22" height="10" fill="#0369a1"/>
    <text x="92" y="44" font-family="sans-serif" font-size="13" font-weight="700">x</text>
    <text x="92" y="112" font-family="sans-serif" font-size="13" font-weight="700">z</text>
    <text x="92" y="154" font-family="sans-serif" font-size="13" font-weight="700">y</text>
    <text x="55" y="212" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Hình 2</text>
  </g>

  <!-- Hình 3: Lệch vị trí tâm động / khác kích thước -->
  <g transform="translate(384, 20)">
    <rect x="24" y="10" width="22" height="170" rx="11" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
    <circle cx="35" cy="70" r="7" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <rect x="24" y="34" width="22" height="10" fill="#0f766e"/>
    <rect x="24" y="102" width="22" height="10" fill="#0369a1"/>
    <rect x="24" y="144" width="22" height="10" fill="#be123c"/>
    <text x="10" y="44" font-family="sans-serif" font-size="13" font-weight="700">X</text>
    <text x="10" y="112" font-family="sans-serif" font-size="13" font-weight="700">Y</text>
    <text x="10" y="154" font-family="sans-serif" font-size="13" font-weight="700">Z</text>

    <rect x="64" y="36" width="22" height="144" rx="11" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
    <circle cx="75" cy="96" r="7" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <rect x="64" y="56" width="22" height="10" fill="#0f766e"/>
    <rect x="64" y="122" width="22" height="10" fill="#0369a1"/>
    <text x="92" y="66" font-family="sans-serif" font-size="13" font-weight="700">x</text>
    <text x="92" y="132" font-family="sans-serif" font-size="13" font-weight="700">y</text>
    <text x="55" y="212" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Hình 3</text>
  </g>

  <!-- Hình 4 (ĐÚNG): Cặp NST tương đồng chuẩn xác (X-x, Y-y, Z-z đối xứng đúng locus) -->
  <g transform="translate(558, 20)">
    <rect x="24" y="10" width="22" height="170" rx="11" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
    <circle cx="35" cy="70" r="7" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <rect x="24" y="34" width="22" height="10" fill="#0f766e"/>
    <rect x="24" y="102" width="22" height="10" fill="#0369a1"/>
    <rect x="24" y="144" width="22" height="10" fill="#be123c"/>
    <text x="10" y="44" font-family="sans-serif" font-size="13" font-weight="700">X</text>
    <text x="10" y="112" font-family="sans-serif" font-size="13" font-weight="700">Y</text>
    <text x="10" y="154" font-family="sans-serif" font-size="13" font-weight="700">Z</text>

    <rect x="64" y="10" width="22" height="170" rx="11" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
    <circle cx="75" cy="70" r="7" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <rect x="64" y="34" width="22" height="10" fill="#0f766e"/>
    <rect x="64" y="102" width="22" height="10" fill="#0369a1"/>
    <rect x="64" y="144" width="22" height="10" fill="#be123c"/>
    <text x="92" y="44" font-family="sans-serif" font-size="13" font-weight="700">x</text>
    <text x="92" y="112" font-family="sans-serif" font-size="13" font-weight="700">y</text>
    <text x="92" y="154" font-family="sans-serif" font-size="13" font-weight="700">z</text>
    <text x="55" y="212" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Hình 4</text>
  </g>
</svg>
